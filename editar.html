<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<div class="container mt-5">
    <h3 class="text-center mb-4">✏️ Editar Producto</h3>
    <!-- 👇 Asegúrate de incluir la acción con el ID del producto -->
    <form method="post" action="/actualizar/{{ producto._id }}" class="card card-body bg-secondary text-light">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Código de Barras:</label>
                <input type="text" name="codigo" class="form-control" value="{{ producto.codigo_barras }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Nombre:</label>
                <input type="text" name="nombre" class="form-control" value="{{ producto.nombre }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Precio Venta:</label>
                <input type="number" name="precio_v" class="form-control" step="0.01" value="{{ producto.precio_venta }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Precio Compra:</label>
                <input type="number" name="precio_c" class="form-control" step="0.01" value="{{ producto.precio_compra }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Stock:</label>
                <input type="number" name="stock" class="form-control" value="{{ producto.stock }}" required>
            </div>
            <div class="col-12 text-center mt-3">
                <button class="btn btn-success me-2">💾 Guardar Cambios</button>
                <a href="/" class="btn btn-secondary">↩️ Cancelar</a>
            </div>
        </div>
    </form>
</div>
</body>
</html>
